name: Convert Ruleset

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * 5'
  push:
    branches:
      - 'main'

permissions:
  contents: write
  actions: write

jobs:
  mihomo_job:
    runs-on: ubuntu-latest

    steps:
    - name: Set Environment & Time
      run: echo "BUILDTIME=$(date -u -d '+8 hours' +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV
      
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Dependencies
      run: sudo apt-get update && sudo apt-get install -y wget curl

    - name: Download Mihomo Core
      run: |
        MIHOMO_VER=$(curl -s "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
        wget -O mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VER}/mihomo-linux-amd64-${MIHOMO_VER}.gz"
        gunzip mihomo.gz && chmod +x mihomo && sudo mv mihomo /usr/local/bin/

    - name: Prepare Directories
      run: mkdir -p publish_mihomo

    - name: Download Source Rules
      run: |
        wget -O awavenue-ads.yaml https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Clash.yaml
        wget -O ChinaASN.list https://raw.githubusercontent.com/ForestL18/rules-dat/mihomo/asn/combined/China-ASN-combined.list   
        wget -O cn.txt https://raw.githubusercontent.com/nekolsd/sing-geosite/domain-set/cn.txt

    - name: Convert for Mihomo (.mrs)
      run: |
        mihomo convert-ruleset classical yaml ./awavenue-ads.yaml ./publish_mihomo/awavenue-ads.mrs
        mihomo convert-ruleset domain text ./cn.txt ./publish_mihomo/cn_domain.mrs
        mihomo convert-ruleset ipcidr text ./ChinaASN.list ./publish_mihomo/cn_ip.mrs

        for file in custom_direct.list custom_emby.list custom_reject.list; do
          if [ -f "$file" ]; then
            filename=$(basename "$file" .list)
            mihomo convert-ruleset domain text "./$file" "./publish_mihomo/$filename.mrs"
          fi
        done

    - name: Push to 'mihomo' branch
      run: |
        cd publish_mihomo
        [ -z "$(ls -A)" ] && touch .keep
        git init
        git config --local user.name "github-actions[bot]"
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout -b mihomo
        git add .
        git commit -m "Mihomo Rules: ${{ env.BUILDTIME }}"
        git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
        git push -u origin mihomo --force

    - name: Telegram Notification (Mihomo)
      if: success()
      run: |
        RULES="AWAvenue, cn_domain, cn_ip"
        
        [ -f "custom_direct.list" ] && RULES="$RULES, Direct"
        [ -f "custom_emby.list" ] && RULES="$RULES, Emby"
        [ -f "custom_reject.list" ] && RULES="$RULES, Reject"

        MSG="<b>✅ Mihomo 规则转换完成</b>%0A%0A<b>更新时间:</b> ${{ env.BUILDTIME }}%0A<b>更新列表:</b> $RULES"

        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d "parse_mode=HTML" \
          -d "disable_web_page_preview=true" \
          --data-urlencode "text=$MSG"

  singbox_job:
    runs-on: ubuntu-latest

    steps:
    - name: Set Environment & Time
      run: echo "BUILDTIME=$(date -u -d '+8 hours' +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV
      
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: sudo apt-get update && sudo apt-get install -y wget curl

    - name: Download Sing-box Core
      run: |
        SB_TAG=$(curl -s "https://api.github.com/repos/SagerNet/sing-box/releases/latest" | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')
        wget -O sing-box.deb "https://github.com/SagerNet/sing-box/releases/download/v${SB_TAG}/sing-box_${SB_TAG}_linux_amd64.deb"
        sudo dpkg -i sing-box.deb && rm sing-box.deb

    - name: Prepare Directories
      run: mkdir -p publish_singbox temp_json

    - name: Download Source Rules
      run: |
        wget -O ChinaASN.list https://raw.githubusercontent.com/ForestL18/rules-dat/mihomo/asn/combined/China-ASN-combined.list   

    - name: Convert for Sing-box (.srs)
      run: |
        python3 <<EOF
        import json
        import os

        def save_json(data, filename):
            with open(filename, 'w', encoding='utf-8') as f:
                json.dump(data, f, ensure_ascii=False, indent=2)

        if os.path.exists('ChinaASN.list'):
            with open('ChinaASN.list', 'r', encoding='utf-8') as f:
                cidrs = [line.strip() for line in f if line.strip()]
            if cidrs:
                srs_data = { "version": 1, "rules": [{"ip_cidr": cidrs}] }
                save_json(srs_data, 'temp_json/cn_ip.json') 

        custom_files = ['custom_direct.list', 'custom_emby.list', 'custom_reject.list']
        for list_file in custom_files:
            if os.path.exists(list_file):
                with open(list_file, 'r', encoding='utf-8') as f:
                    domains = [line.strip() for line in f if line.strip() and not line.startswith('#')]
                if domains:
                    filename = os.path.splitext(os.path.basename(list_file))[0]
                    srs_data = { "version": 1, "rules": [{"domain_suffix": domains}] }
                    save_json(srs_data, f'temp_json/{filename}.json')
        EOF

        for json_file in temp_json/*.json; do
          [ -e "$json_file" ] || continue
          filename=$(basename "$json_file" .json)
          sing-box rule-set compile --output "publish_singbox/$filename.srs" "$json_file"
        done

    - name: Push to 'singbox' branch
      run: |
        cd publish_singbox
        [ -z "$(ls -A)" ] && touch .keep
        git init
        git config --local user.name "github-actions[bot]"
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout -b singbox
        git add .
        git commit -m "Sing-box Rules: ${{ env.BUILDTIME }}"
        git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
        git push -u origin singbox --force

    - name: Telegram Notification (Sing-box)
      if: success()
      run: |
        RULES="cn_ip"
        
        [ -f "custom_direct.list" ] && RULES="$RULES, Direct"
        [ -f "custom_emby.list" ] && RULES="$RULES, Emby"
        [ -f "custom_reject.list" ] && RULES="$RULES, Reject"

        MSG="<b>✅ Sing-box 规则转换完成</b>%0A%0A<b>更新时间:</b> ${{ env.BUILDTIME }}%0A<b>更新列表:</b> $RULES"

        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d "parse_mode=HTML" \
          -d "disable_web_page_preview=true" \
          --data-urlencode "text=$MSG"

  cleanup_job:
    needs: [mihomo_job, singbox_job]
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 0
        keep_minimum_runs: 1
        delete_workflow_pattern: "${{ github.workflow }}"
        delete_workflow_by_state_pattern: "active"
        delete_run_by_conclusion_pattern: "success, failure, cancelled, skipped"